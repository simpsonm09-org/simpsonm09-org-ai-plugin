# Dependency updates come from Dependabot. Dependabot has no shareable preset, so
# this file lives in each repository. Keep the shape the standard checks. See
# docs/automation.md.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
