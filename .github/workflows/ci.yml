name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/lint.yml@c8fecea588e8f72584227afe508c3c9b38bbacc3 # repo-standard main
  aislop:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/aislop.yml@c8fecea588e8f72584227afe508c3c9b38bbacc3 # repo-standard main
  security:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/security.yml@c8fecea588e8f72584227afe508c3c9b38bbacc3 # repo-standard main
  standard:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/standard.yml@c8fecea588e8f72584227afe508c3c9b38bbacc3 # repo-standard main
  coverage:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/coverage.yml@c8fecea588e8f72584227afe508c3c9b38bbacc3 # repo-standard main

  test:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test

  test-windows:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - name: Focused portability regression
        run: just test-portable

  test-macos:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - name: Focused portability regression
        run: just test-portable
